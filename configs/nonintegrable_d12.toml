[protocol]
name = "nonintegrable_ising_L4"
physical_dimension = 2
bond_dimension = 12
block_length = 4
delta_t = 0.001
g = 1.05
h = -0.5
J = -1.0
trotter_order = 2
symmetric_transverse = false

[optimizer]
method = "gauge_orthogonal_levenberg_marquardt"
