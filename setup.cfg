[metadata]
name = lomps
version = 0.1.0
description = Local optimization of matrix-product states for finite-window quantum dynamics
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    numpy>=1.26
    scipy>=1.11

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8

[options.entry_points]
console_scripts =
    lomps-run = lomps.evolution:main
    lomps-convert-tensor = lomps.convert_tensor:main
